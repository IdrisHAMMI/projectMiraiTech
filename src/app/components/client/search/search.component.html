<app-header></app-header>

<div class="container mx-auto px-4 py-8 flex-1">
  <div class="search-container flex justify-center mb-8">
      <mat-form-field appearance="fill">
          <mat-label>Search</mat-label>
          <input #searchInput matInput placeholder="Search" class="w-full">
          <button mat-button matSuffix (click)="onSearch(searchInput.value)">
              <mat-icon>search</mat-icon>
          </button>
      </mat-form-field>
  </div>
  
  <div class="result-section grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <h2 class="result-heading text-center mb-4 col-span-full">Résultat</h2>
      <div *ngFor="let product of products | filter:searchQuery" class="product-item bg-white rounded-lg shadow-md">
          <a [routerLink]="['/productItem', product._id]">
              <p class="product-name text-center text-lg mb-2">{{ product.productName }}</p>
              <div class="image-container flex justify-center items-center">
                  <img [src]="'assets/upload/' + product.productImageURL" class="product-image rounded-lg">
              </div>
              <div class="product-info p-4">
                  <p class="product-description mb-2">{{ product.productDescription }}</p>
                  <p class="product-price text-blue-500">{{ product.productPrice | currency }}</p>

              </div>
          </a>
      </div>
  </div>
</div>

<app-footer></app-footer>
